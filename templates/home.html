{% extends 'base.html' %}

{% block title %}ShopEase | Home{% endblock %}

{% block content %}
<div class="container py-5">
  <h2 class="text-center mb-5 fw-bold">Our Featured Products</h2>

  <div class="row justify-content-center g-4">
    {% for product in products %}
    <div class="col-12 col-sm-6 col-md-4 col-lg-3 d-flex justify-content-center">
      <div class="card shadow-sm border-0 h-100 d-flex flex-column" style="width: 18rem;">
        <!-- Product Image -->
        <div class="ratio ratio-1x1" style="overflow:hidden;">
          <img src="{{ product.image }}" class="card-img-top" alt="{{ product.name }}"
               style="object-fit: cover; height: 250px; width: 100%;">
        </div>

        <!-- Product Info -->
        <div class="card-body d-flex flex-column justify-content-between">
          <div>
            <h5 class="card-title fw-semibold text-truncate">{{ product.name }}</h5>
            <p class="card-text text-muted small mb-2"
               style="overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;">
              {{ product.description }}
            </p>
          </div>

          <div class="mt-auto">
            <p class="price fw-bold fs-5 text-primary mb-3">₹{{ "%.2f"|format(product.price) }}</p>
            <form action="{{ url_for('add_to_cart', product_id=product.id) }}" method="POST">
              <button type="submit" class="btn btn-primary w-100 fw-semibold">Add to Cart</button>
            </form>
          </div>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
